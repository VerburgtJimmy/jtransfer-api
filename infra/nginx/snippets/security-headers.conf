# Security headers applied to every Tessil vhost.
# Include this from each server { } block:  include snippets/tessil-security-headers.conf;
#
# `always` ensures the headers are emitted for error responses too — critical
# for HSTS, since a 4xx/5xx without it can be downgraded by an active attacker.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Defense-in-depth: CSP frame-ancestors supersedes X-Frame-Options on modern browsers,
# but X-Frame-Options is cheap and still respected by older clients.
add_header X-Frame-Options "DENY" always;

# Note: X-XSS-Protection is intentionally omitted — modern browsers ignore it or
# behave worse with it set. nginx is the single source of truth for response
# security headers; the API application code does not set them.

# Content-Security-Policy. Header, not <meta>: a meta CSP does not govern markup
# above it, which is how the 2026-06 analytics key leak happened (docs/audit/34).
# script-src is loose here on purpose; SvelteKit delivers a second, hash-pinned
# script policy (svelte.config.js `csp`) and both must pass.
# connect-src is the anti-exfiltration allowlist. Never widen it back to `https:`.
# frame-src 'self' is needed by the streaming-download Service Worker iframe.
# Keep on one line: a wrapped value is an nginx syntax error.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.r2.cloudflarestorage.com; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
