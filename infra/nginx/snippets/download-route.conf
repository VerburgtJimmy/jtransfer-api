# Network-level robots policy for the SPA's download routes.
#
# JTransfer's privacy model treats /d/<id>#<key> as sensitive — the URL fragment
# carries the decryption key, and even the path alone can leak the existence of
# a transfer to an indexer or scraper. Include this from the FRONTEND server { }
# block (jtransfer.jimmyverburgt.com vhost), inside `location ~ ^/d/`.

add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
