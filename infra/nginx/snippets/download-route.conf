# Network-level robots policy for the SPA's download routes.
#
# JTransfer's privacy model treats /d/<id>#<key> as sensitive — the URL fragment
# carries the decryption key, and even the path alone can leak the existence of
# a transfer to an indexer or scraper. Include this from the FRONTEND server { }
# block (jtransfer.jimmyverburgt.com vhost), inside `location ~ ^/d/`.
#
# nginx gotcha: any add_header at location scope voids inheritance of server-scope
# add_header directives. We therefore re-emit the security headers here so the
# /d/* response carries BOTH the robots policy AND the full security header set.
# Keep this list in sync with snippets/jtransfer-security-headers.conf.

add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
