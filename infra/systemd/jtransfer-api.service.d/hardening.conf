# Hardening drop-in for the Ploi-managed jtransfer-api.service.
#
# Ploi auto-generates the main unit file. This drop-in *augments* it with
# systemd sandboxing directives — it does not replace the unit. To apply:
#
#   sudo install -d -m 0755 /etc/systemd/system/jtransfer-api.service.d
#   sudo install -m 0644 hardening.conf \
#       /etc/systemd/system/jtransfer-api.service.d/hardening.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart jtransfer-api
#
# Verify with:
#   systemd-analyze security jtransfer-api
# Aim for a score under 3.0.

[Service]
# Filesystem isolation
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/ploi/jtransfer-api.jimmyverburgt.com
PrivateTmp=true
PrivateDevices=true

# Kernel surface reduction
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictRealtime=true
LockPersonality=true

# Syscall surface reduction
# @resources is intentionally left allowed — Bun calls prlimit64 / setrlimit
# during startup to raise file-descriptor ceilings, and denying that group
# causes SIGSYS (status=31/SYS) on boot.
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged

# Network address families — UNIX sockets for Postgres/Redis local IPC,
# INET/INET6 for the listening port.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

# Resource ceilings — tune to the box. CX22 (4 GB RAM) handles 1 GiB cap fine.
MemoryMax=1G
TasksMax=512
