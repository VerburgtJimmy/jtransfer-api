# Hardening drop-in for tessil-api.service.
#
# Ploi runs daemons under Supervisor, not systemd, so the main unit is the
# hand-rolled `tessil-api.service` in this directory (Route B) — not a
# Ploi-generated unit. This drop-in *augments* that unit with systemd
# sandboxing directives. To apply:
#
#   sudo install -d -m 0755 /etc/systemd/system/tessil-api.service.d
#   sudo install -m 0644 hardening.conf \
#       /etc/systemd/system/tessil-api.service.d/hardening.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart tessil-api
#
# Verify with:
#   systemd-analyze security tessil-api
# Aim for a score under 3.0.

[Service]
# Filesystem isolation
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=read-only
# No ReadWritePaths: the API is disk-stateless — uploads go to R2 via presigned
# URLs, state lives in Postgres/Redis, GeoIP MMDBs are read-only. PrivateTmp
# gives it a private writable /tmp for anything transient. If a future build
# needs to write under its site dir, add an env-specific override (the path
# differs per environment, so it does not belong in this shared file):
#   /etc/systemd/system/tessil-api.service.d/local.conf
#     [Service]
#     ReadWritePaths=/home/<run-user>/<site-dir>
PrivateTmp=true
PrivateDevices=true

# Kernel surface reduction
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictRealtime=true
LockPersonality=true

# Capabilities — a non-root service binding a high port (3000) needs none.
# Dropping the whole bounding set is the biggest single hardening win: it
# removes CAP_SYS_ADMIN, CAP_SET[UG]ID, CAP_SYS_PTRACE, CAP_NET_ADMIN, etc.
# DO NOT add MemoryDenyWriteExecute — Bun's JIT needs W+X memory mappings and
# crashes without them.
CapabilityBoundingSet=
ProtectClock=true
ProtectKernelLogs=true
ProtectHostname=true
ProtectProc=invisible
RestrictSUIDSGID=true
RemoveIPC=true
UMask=0077

# Syscall surface reduction
# @resources is intentionally left allowed — Bun calls prlimit64 / setrlimit
# during startup to raise file-descriptor ceilings, and denying that group
# causes SIGSYS (status=31/SYS) on boot.
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged

# Network address families — UNIX sockets for Postgres/Redis local IPC,
# INET/INET6 for the listening port.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

# Resource ceilings — tune to the box. CPX31 (8 GB RAM); 1 GiB is ample since
# uploads stream to R2 via presigned URLs and are never buffered in-process.
MemoryMax=1G
TasksMax=512
