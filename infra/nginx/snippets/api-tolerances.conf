# API-side tolerances for the brief 1–3 second restart gap when
# `systemctl restart tessil-api` swaps the binary.
#
# Include from inside the API server { } block, AFTER the `proxy_pass` line,
# OR inside the same `location { }` that has the proxy_pass.

proxy_connect_timeout 5s;
proxy_read_timeout    60s;

# Retry transparently across 502/503/connection refused errors. Most clients
# won't see the blip during a routine deploy.
proxy_next_upstream         error timeout http_502 http_503;
proxy_next_upstream_tries   3;
proxy_next_upstream_timeout 5s;
